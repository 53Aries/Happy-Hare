# Example mmu_hardware.cfg configuration for Load Cell Filament Sensor
# Modify the [mmu_sensors] section in your mmu/base/mmu_hardware.cfg

[mmu_sensors]
# ... other sensor pins ...

# These sensors are on the toolhead and often controlled by the main printer mcu
extruder_switch_pin: your_mcu:PA8     # Your extruder entry sensor (optional but recommended for auto-tare)
toolhead_switch_pin: load_cell_filament_sensor:toolhead  # Virtual sensor from load cell

# The toolhead_switch_pin now references the virtual sensor instead of a physical pin
# This allows the load cell to function as a filament detection endstop
# The format is: load_cell_filament_sensor:<sensor_name>
# where <sensor_name> matches the name in your [load_cell_filament_sensor] config
