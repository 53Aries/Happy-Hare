# Example configuration for Load Cell Filament Sensor
# NOTE: This configuration is now in config/base/mmu_load_cell_sensor.cfg
# Edit that file instead of adding this to printer.cfg
#
# This example shows the available parameters for reference

# Load Cell Filament Sensor for Happy Hare MMU
# Virtual sensor that monitors load cell force to detect filament presence
[load_cell_filament_sensor toolhead]
load_cell: load_cell_probe        # Reference to your load_cell_probe section
trigger_force: 30.0                # Force in grams to trigger filament detection (ADJUST BASED ON TESTING)
hysteresis: 5.0                    # Force hysteresis to prevent oscillation
sample_count: 3                    # Number of samples to average for stability
tare_on_home: True                 # Auto-tare baseline force on startup
tare_on_extruder_entry: True       # Auto-tare when extruder entry sensor triggers (if configured)
event_delay: 0.1                   # Delay between sensor events

# IMPORTANT: Make sure you have a load cell probe configured, for example:
# [load_cell_probe]
# sensor_type: ads1220
# cs_pin: your_cs_pin
# data_ready_pin: your_drdy_pin
# spi_software_sclk_pin: your_sclk_pin
# spi_software_mosi_pin: your_mosi_pin
# spi_software_miso_pin: your_miso_pin
# ...
# See your load cell probe documentation for full configuration
