# Load Cell Filament Sensor Testing & Calibration Macros
# Helper macros for testing and calibrating the load cell filament sensor

[gcode_macro TEST_LOAD_CELL_SENSOR]
description: Test the load cell filament sensor and display current readings
gcode:
    {% set sensor = "toolhead" %}
    {% set status = printer["load_cell_filament_sensor " ~ sensor] %}
    
    RESPOND MSG="=== Load Cell Filament Sensor Test ==="
    RESPOND MSG="Sensor: {sensor}"
    RESPOND MSG="Enabled: {status.enabled}"
    RESPOND MSG="Filament Detected: {status.filament_detected}"
    RESPOND MSG="Current Force: {status.force}g"
    RESPOND MSG="Baseline Force: {status.baseline_force}g"
    RESPOND MSG="Force Delta: {status.force_delta}g"
    RESPOND MSG="Trigger Threshold: {status.trigger_force}g"
    
    {% if status.force_delta >= status.trigger_force %}
        RESPOND MSG=">>> FILAMENT DETECTED <<<"
    {% else %}
        RESPOND MSG=">>> NO FILAMENT <<<"
    {% endif %}

[gcode_macro CALIBRATE_LOAD_CELL_SENSOR]
description: Interactive calibration for the load cell filament sensor trigger force
gcode:
    RESPOND MSG="=== Load Cell Filament Sensor Calibration ==="
    RESPOND MSG="Step 1: Ensure NO filament is loaded, then run: LOAD_CELL_SENSOR_TARE SENSOR=toolhead"
    RESPOND MSG="Step 2: Load filament manually and observe force with: TEST_LOAD_CELL_SENSOR"
    RESPOND MSG="Step 3: Adjust trigger_force in printer.cfg to a value between baseline and loaded force"
    RESPOND MSG="Step 4: Restart Klipper and test with Happy Hare"
    RESPOND MSG=""
    RESPOND MSG="Current Settings:"
    TEST_LOAD_CELL_SENSOR

[gcode_macro MONITOR_LOAD_CELL_SENSOR]
description: Continuously monitor load cell sensor readings (runs for 30 seconds)
gcode:
    {% set sensor = "toolhead" %}
    {% set duration = params.DURATION|default(30)|int %}
    {% set interval = params.INTERVAL|default(1)|float %}
    
    RESPOND MSG="=== Monitoring Load Cell Sensor for {duration}s ==="
    RESPOND MSG="Interval: {interval}s"
    RESPOND MSG="Press PAUSE to stop monitoring"
    RESPOND MSG=""
    
    {% for i in range(duration) %}
        {% if not printer.pause_resume.is_paused %}
            TEST_LOAD_CELL_SENSOR
            G4 P{interval * 1000}
        {% endif %}
    {% endfor %}
    
    RESPOND MSG="=== Monitoring Complete ==="

[gcode_macro TEST_LOAD_CELL_HOMING]
description: Test load cell sensor as endstop with a homing move
gcode:
    {% set distance = params.DISTANCE|default(50)|float %}
    {% set speed = params.SPEED|default(10)|float %}
    
    RESPOND MSG="=== Testing Load Cell Sensor Homing ==="
    RESPOND MSG="This will attempt to home the extruder using the load cell sensor"
    RESPOND MSG="Distance: {distance}mm, Speed: {speed}mm/s"
    RESPOND MSG=""
    
    # Query initial state
    QUERY_FILAMENT_SENSOR SENSOR=toolhead
    
    # This would be called by Happy Hare during actual homing
    # For manual testing, use Happy Hare's MMU_TEST_HOMING_MOVE command
    RESPOND MSG="To test homing, use Happy Hare's test command:"
    RESPOND MSG="MMU_TEST_HOMING_MOVE MOTOR=gear+extruder MOVE={distance} ENDSTOP=toolhead STOP_ON_ENDSTOP=1"

[gcode_macro LOAD_CELL_SENSOR_STATUS]
description: Quick status check of load cell filament sensor
gcode:
    QUERY_FILAMENT_SENSOR SENSOR=toolhead
    {% set status = printer["load_cell_filament_sensor toolhead"] %}
    RESPOND MSG="Force Delta: {status.force_delta}g (Threshold: {status.trigger_force}g)"
