########################################################################################################################
# Happy Hare MMU Software - Previous Temperature Purge
#
# EDIT THIS FILE BASED ON YOUR SETUP
#
# Goal: When a new print's nozzle temperature is significantly LOWER than the temperature of the
#       filament loaded during the previous print, Happy Hare will:
#
#         1. (_MMU_PREVTEMP_PRE_LOAD)
#            Before the load begins, heat the nozzle up to the previous filament's temperature so
#            that any old residue in the nozzle is fully fluid and the new filament is loaded into
#            a properly heated hotend.
#
#         2. (normal HH load + optional purge_macro runs at the higher temperature — ideal for
#            flushing old residue)
#
#         3. (_MMU_PREVTEMP_POST_LOAD)
#            After the load (and any standard purge) completes:
#              a. Purge 'purge_length_high_temp' mm at the previous (high) temperature to
#                 thoroughly flush old residue mixed with the new filament.
#              b. Cool the nozzle down to the actual print target temperature.
#              c. Purge 'purge_length_low_temp' mm to flush any portion of the new filament
#                 that was overheated while sitting at the higher temperature.
#
# SETUP:
#   This file is already included via mmu_macro_vars.cfg. To activate, either:
#     a) Set variable_enable : True  in [gcode_macro _MMU_PREVTEMP_PURGE_VARS] below, OR
#     b) Leave enable as False and call SET_GCODE_VARIABLE at runtime to toggle.
#
#   The hooks are wired automatically when this file is included:
#     variable_user_pre_load_extension  : '_MMU_PREVTEMP_PRE_LOAD'
#     variable_user_post_load_extension : '_MMU_PREVTEMP_POST_LOAD'
#   Those lines are already set in mmu_macro_vars.cfg.
#
# NOTES:
#   - 'last_tool' is HH's persisted record of the previously loaded tool gate. It survives
#     across Klipper restarts so this works correctly at the start of a brand-new print.
#   - This only triggers when prev_temp > (current slicer target + min_temp_delta).
#   - The feature is silently skipped when last_tool is unknown (-1) or the temperature
#     difference is within the min_temp_delta threshold.
#   - Purge lengths are in mm of filament (not volume). Tune them to suit your setup.
#


###########################################################################
# Configuration variables — edit these to match your preferences
#
[gcode_macro _MMU_PREVTEMP_PURGE_VARS]
description: Configuration for previous-temperature purge feature
gcode: # Leave empty

# Master switch. Set to True to enable the feature.
variable_enable                 : False     ; True = active, False = disabled

# Minimum temperature difference (°C) between the previous filament's temperature
# and the new slicer target required to trigger the sequence. This prevents
# unnecessary extra purging for trivial temperature differences (e.g. 235 → 230).
variable_min_temp_delta         : 10        ; °C delta required to activate

# How many mm of filament to purge while still at the previous (higher) temperature.
# This flushes old residue and the initial mixed portion of the new filament.
# Tune upward for materials with large colour/material differences (e.g. dark → light).
variable_purge_length_high_temp : 30        ; mm at high (previous) temp

# How many mm of filament to purge after cooling to the new print temperature.
# This clears the portion of the new filament that was sitting at elevated temperature.
variable_purge_length_low_temp  : 20        ; mm at new (lower) print temp


###########################################################################
# Internal state — do not edit
#
[gcode_macro _MMU_PREVTEMP_STATE]
description: Internal state tracking for previous-temperature purge (do not edit)
gcode: # Leave empty

variable_active     : False     ; True when the sequence was triggered for the current load
variable_prev_temp  : 0         ; Previous filament temperature we heated up to
variable_target_temp: 0         ; Slicer's actual target temperature to restore to


###########################################################################
# _MMU_PREVTEMP_PRE_LOAD
#
# Called via variable_user_pre_load_extension in _MMU_SEQUENCE_VARS.
# Determines whether the previous filament's gate temperature is meaningfully
# higher than the current slicer target and, if so, heats up to it.
#
[gcode_macro _MMU_PREVTEMP_PRE_LOAD]
description: Pre-load hook — heats to previous filament temp when needed
gcode:
    {% set cfg = printer['gcode_macro _MMU_PREVTEMP_PURGE_VARS'] %}

    # Always reset state so a skipped load doesn't bleed into the next
    SET_GCODE_VARIABLE MACRO=_MMU_PREVTEMP_STATE VARIABLE=active      VALUE=False
    SET_GCODE_VARIABLE MACRO=_MMU_PREVTEMP_STATE VARIABLE=prev_temp   VALUE=0
    SET_GCODE_VARIABLE MACRO=_MMU_PREVTEMP_STATE VARIABLE=target_temp VALUE=0

    {% if cfg.enable %}
        {% set last_tool   = printer.mmu.last_tool | int %}
        {% set ttg_map     = printer.mmu.ttg_map %}
        {% set gate_temps  = printer.mmu.gate_temperature %}
        {% set target_temp = printer.extruder.target | float %}

        # Guard: last_tool must be a valid, known tool index
        {% if last_tool >= 0 and last_tool < ttg_map | length %}
            {% set prev_gate = ttg_map[last_tool] | int %}

            {% if prev_gate >= 0 and prev_gate < gate_temps | length %}
                {% set prev_temp = gate_temps[prev_gate] | float %}

                {% if prev_temp > (target_temp + cfg.min_temp_delta) %}
                    MMU_LOG MSG="PrevTemp Purge: previous filament (T{last_tool}/G{prev_gate}) was {prev_temp}°C — new target is {target_temp}°C. Heating to {prev_temp}°C for load."

                    SET_GCODE_VARIABLE MACRO=_MMU_PREVTEMP_STATE VARIABLE=active      VALUE=True
                    SET_GCODE_VARIABLE MACRO=_MMU_PREVTEMP_STATE VARIABLE=prev_temp   VALUE={prev_temp}
                    SET_GCODE_VARIABLE MACRO=_MMU_PREVTEMP_STATE VARIABLE=target_temp VALUE={target_temp}

                    M109 S{prev_temp}
                {% endif %}
            {% endif %}
        {% endif %}
    {% endif %}


###########################################################################
# _MMU_PREVTEMP_POST_LOAD
#
# Called via variable_user_post_load_extension in _MMU_SEQUENCE_VARS.
# Runs only when _MMU_PREVTEMP_PRE_LOAD triggered the sequence.
#
# Phase 1 — Purge at the previous (high) temperature.
# Phase 2 — Cool to the actual slicer target and wait.
# Phase 3 — Purge at the new temperature to flush overheated filament.
#
[gcode_macro _MMU_PREVTEMP_POST_LOAD]
description: Post-load hook — temperature-stepped purge after prev-temp load
gcode:
    {% set state = printer['gcode_macro _MMU_PREVTEMP_STATE'] %}

    {% if state.active %}
        {% set cfg           = printer['gcode_macro _MMU_PREVTEMP_PURGE_VARS'] %}
        {% set seq           = printer['gcode_macro _MMU_SEQUENCE_VARS'] %}
        {% set purge_vars    = printer['gcode_macro _MMU_PURGE_VARS'] %}
        {% set park          = printer['gcode_macro _MMU_PARK'] %}

        {% set prev_temp        = state.prev_temp | float %}
        {% set target_temp      = state.target_temp | float %}
        {% set purge_high       = cfg.purge_length_high_temp | float %}
        {% set purge_low        = cfg.purge_length_low_temp | float %}
        {% set purge_speed      = purge_vars.extruder_purge_speed | float %}
        {% set retracted        = park.retracted_length | default(0) | float %}
        {% set unretract_speed  = seq.unretract_speed | int %}
        {% set retract_speed    = seq.retract_speed | int %}

        # Un-retract if HH has the filament tip retracted (mirrors pattern in _MMU_PURGE)
        {% if retracted > 0 %}
            MMU_LOG MSG="PrevTemp Purge: un-retracting {retracted}mm before purge"
            M83
            G1 E{retracted} F{unretract_speed * 60}
        {% endif %}

        # --- Phase 1: Purge at the previous (higher) temperature ---
        MMU_LOG MSG="PrevTemp Purge: purging {purge_high}mm at {prev_temp}°C to flush residue"
        M83
        G1 E{purge_high} F{purge_speed * 60}

        # --- Phase 2: Cool down to the actual print temperature ---
        MMU_LOG MSG="PrevTemp Purge: cooling to {target_temp}°C..."
        M104 S{target_temp}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target_temp - 2} MAXIMUM={target_temp + 10}

        # --- Phase 3: Purge at the new (lower) print temperature ---
        MMU_LOG MSG="PrevTemp Purge: purging {purge_low}mm at {target_temp}°C to flush overheated filament"
        M83
        G1 E{purge_low} F{purge_speed * 60}

        # Re-retract to restore the state HH expects after this macro
        {% if retracted > 0 %}
            MMU_LOG MSG="PrevTemp Purge: re-retracting {retracted}mm"
            M83
            G1 E-{retracted} F{retract_speed * 60}
        {% endif %}

        # Clear state so the next load starts clean
        SET_GCODE_VARIABLE MACRO=_MMU_PREVTEMP_STATE VARIABLE=active VALUE=False

        MMU_LOG MSG="PrevTemp Purge: complete — nozzle ready at {target_temp}°C"

    {% endif %}
