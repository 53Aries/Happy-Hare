# Load Cell Filament Sensor Configuration
# This file provides configuration for using a load cell probe as a virtual
# toolhead filament sensor for Happy Hare MMU.
#
# SETUP INSTRUCTIONS:
# 1. Uncomment the [load_cell_filament_sensor] section below
# 2. Update 'load_cell' parameter to match your load cell probe name
# 3. Calibrate trigger_force (see config/examples/load_cell_sensor/README.md)
# 4. In mmu_hardware.cfg, set: toolhead_switch_pin: load_cell_filament_sensor:toolhead
# 5. Restart Klipper and calibrate using LOAD_CELL_SENSOR_TARE and TEST_LOAD_CELL_SENSOR
#
# REQUIREMENTS:
# - Load cell probe configured and calibrated in Klipper
# - Load cell must have counts_per_gram and reference_tare_counts set
# - Extruder entry sensor recommended for auto-tare feature
#
# See config/examples/load_cell_sensor/README.md for detailed calibration guide

#[load_cell_filament_sensor toolhead]
# The name of the load cell probe to monitor
#load_cell: load_cell_probe
#
# Force threshold in grams that triggers the sensor (REQUIRED)
# Calibrate by manually loading filament and observing force with TEST_LOAD_CELL_SENSOR
# Set to 50-70% of the peak force observed during loading
#trigger_force: 30.0
#
# Hysteresis in grams - prevents oscillation near threshold
# Lower values = more sensitive but may trigger multiple times
# Higher values = more stable but less sensitive
#hysteresis: 5.0
#
# Number of samples to average for stable readings
# Higher = more stable but slower response
#sample_count: 3
#
# Auto-tare when homing sequence starts (recommended)
# Establishes clean baseline before each load operation
#tare_on_home: True
#
# Auto-tare when extruder entry sensor triggers (recommended if you have one)
# Eliminates thermal drift by taring right before filament reaches toolhead
# Requires extruder_switch_pin configured in mmu_hardware.cfg
#tare_on_extruder_entry: True
#
# Delay in seconds after auto-tare before monitoring resumes
# Allows load cell to settle after tare operation
#event_delay: 0.1
#
# Optional: Manual tare counts override (advanced)
# If set, uses this value instead of auto-tare
# Useful for testing or if auto-tare doesn't work well
#manual_tare_counts: 8388608
#
# Optional: Logging level for debugging
# 0=none, 1=info, 2=debug, 3=trace
#log_level: 1
